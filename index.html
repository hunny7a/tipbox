      new QRCode($("qr"),{text:url,width:200,height:200});
      $("dq").onclick=()=>{const c=document.querySelector("#qr canvas"),z=document.createElement("canvas");z.width=z.height=c.width+60;const g=z.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,z.width,z.height);g.drawImage(c,30,30);const l=document.createElement("a");l.download="tip-qr.png";l.href=z.toDataURL("image/png");l.click()};
      const iv=setInterval(()=>{const l=WIN-(Date.now()-t0);if(l<=0){clearInterval(iv);o.innerHTML='<p class="mut" style="margin-top:16px">Samay khatam ho gaya. Payment ke liye naya tip banao.</p><button class="pri" id="nw2">Naya tip banao</button>';$("nw2").onclick=()=>{o.innerHTML="";$("fm").style.display="block"};return}
        $("tm").textContent=String(Math.floor(l/6e4)).padStart(2,"0")+":"+String(Math.floor(l%6e4/1e3)).padStart(2,"0")},1000);
    }catch(e){o.textContent="Kuch gadbad hui, dobara try karo."}
    $("go").disabled=false};
}
</script></body></html>
