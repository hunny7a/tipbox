<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tip</title>
<style>
:root{--bg:#13121b;--card:#1d1b2a;--tx:#f1effa;--mut:#9b97b3;--ac:#6c4cf5;--bd:#2d2a40}
@media(prefers-color-scheme:light){:root{--bg:#f6f5fb;--card:#fff;--tx:#1b1a24;--mut:#6b6880;--bd:#e3e0f0}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,"Noto Sans Devanagari",sans-serif}
body.ov{background:transparent}
.wrap{max-width:480px;margin:0 auto;padding:16px}.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px}
h1{font-size:22px;margin:0 0 4px}label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
input,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}
button,.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:12px 16px;font:inherit;cursor:pointer;text-decoration:none;display:inline-block}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.chips button{background:var(--bd);color:var(--tx);padding:8px 14px}
.mut{color:var(--mut);font-size:13px}#qr{display:flex;justify-content:center;background:#fff;padding:10px;border-radius:12px;margin:12px 0}
.alert{border-radius:14px;overflow:hidden;color:#111;width:380px;zoom:var(--k,1.75);box-shadow:0 8px 30px #0006;animation:in .5s}
.alert .h{padding:10px 14px;font-weight:700;display:flex;justify-content:space-between}.alert .b{padding:10px 14px;background:#fffe;font-size:18px;word-break:break-word}
@keyframes in{from{transform:translateY(-30px) scale(.9);opacity:0}}
#ovr{position:fixed;top:165px;bottom:24px;right:24px;width:665px;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}
#stage{position:static}
#goalbar{position:static;width:380px;zoom:var(--k,1.75);background:#000a;color:#fff;padding:10px 14px;border-radius:12px;display:none}
.g{height:14px;background:#fff3;border-radius:99px;overflow:hidden;margin:6px 0 4px}.g i{display:block;height:100%;background:linear-gradient(90deg,#6c4cf5,#e84393);transition:width .8s}
</style></head><body>
<div class="wrap" id="app"></div><div id="ovr"><div id="stage"></div><div id="goalbar"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getDatabase,ref,get,set,onValue,onChildAdded,query,orderByChild,startAt} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
const app=initializeApp({apiKey:"AIzaSyDIIhXiwqektV6FJZyN0E3sehT_mT8qShA",authDomain:"mytipbox-13590.firebaseapp.com",
databaseURL:"https://mytipbox-13590-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"mytipbox-13590",appId:"1:846336716098:web:ff63d307fc0c40d04fecdb"});
const db=getDatabase(app),$=id=>document.getElementById(id);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const inr=c=>"₹"+(c/100).toLocaleString("en-IN",{maximumFractionDigits:2});
const hash=location.hash.slice(1),isOv=hash.startsWith("overlay/");
let cfg={};

if(isOv){ // ---------- overlay: #overlay/SECRET  |  /novoice (OBS)  |  /voiceonly (Chrome tab) ----------
  const parts=hash.split("/"),K=parts[1],mode=parts[2]||"",noVoice=mode==="novoice",voiceOnly=mode==="voiceonly";
  if(!voiceOnly)document.body.classList.add("ov");
  if(voiceOnly)$("app").innerHTML=`<div class="card"><h1>🔊 Voice tab</h1><p class="mut">Ye tab sirf awaaz bolta hai. Is page pe <b>ek baar click</b> karo, phir ise minimize kar do (band mat karna). OBS mein Desktop Audio on hona chahiye.</p></div>`;
  let total=0,queue=[],busy=false;
  const tier=c=>c>=100000?"#ff5252":c>=50000?"#ff9800":c>=20000?"#ffd54f":c>=5000?"#4cd964":"#64b5f6";
  const bar=()=>{const t=+cfg.goalTarget||1,p=Math.min(100,total/100/t*100);const g=$("goalbar");g.style.display=cfg.goalTitle&&!voiceOnly?"block":"none";
    g.innerHTML=`<b>${esc(cfg.goalTitle||"")}</b><div class="g"><i style="width:${p}%"></i></div>${inr(total)} / ₹${t.toLocaleString("en-IN")} (${Math.round(p)}%)`};
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  const ding=new Audio("sound.mp3");
  const beep=()=>{try{const c=new AudioContext(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.2;o.start();o.stop(c.currentTime+.25)}catch(e){}};
  const playDing=()=>new Promise(r=>{ding.currentTime=0;ding.onended=r;ding.onerror=()=>{beep();setTimeout(r,300)};ding.play().catch(()=>{beep();setTimeout(r,300)});setTimeout(r,5000)});
  const pickVoice=()=>{const vs=speechSynthesis.getVoices(),L=(cfg.ttsLang||"hi-IN").toLowerCase().replace("_","-"),want=(cfg.ttsVoice||"").toLowerCase();
    const inL=vs.filter(v=>v.lang.toLowerCase().replace("_","-").startsWith(L.slice(0,2))),pool=inL.length?inL:vs;
    if(want){const m=pool.find(v=>v.name.toLowerCase().includes(want))||vs.find(v=>v.name.toLowerCase().includes(want));if(m)return m}
    const bad=/hemant|madhur|prabhat|ravi|david|mark|\bmale\b/i;
    return pool.find(v=>/heera|kalpana|swara|neerja|female|google/i.test(v.name)&&!bad.test(v.name))||pool.find(v=>!bad.test(v.name))||pool[0]};
  try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices()}catch(e){}
  const speak=t=>new Promise(r=>{try{const u=new SpeechSynthesisUtterance(t),v=pickVoice();u.lang=cfg.ttsLang||"hi-IN";if(v){u.voice=v;u.lang=v.lang}u.onend=r;u.onerror=r;speechSynthesis.cancel();speechSynthesis.speak(u);setTimeout(r,25000)}catch(e){r()}});
  const line=a=>{const rs=Math.floor(a.cents/100);return (cfg.ttsLang||"hi-IN").startsWith("hi")?`${a.name} ने ${rs} रुपये भेजे। ${a.msg||""}`:`${a.name} sent ${rs} rupees. ${a.msg||""}`};
  const pump=async()=>{if(busy||!queue.length)return;busy=true;const a=queue.shift();const t0=Date.now(),say=a.cents>=(+cfg.ttsMin||0)*100;
    if(!voiceOnly){$("stage").innerHTML=`<div class="alert"><div class="h" style="background:${tier(a.cents)}"><span>${esc(a.name)}</span><span>${inr(a.cents)}</span></div>${a.msg?`<div class="b">${esc(a.msg)}</div>`:""}</div>`;await playDing()}
    else await sleep((+cfg.voiceDelay||5)*1000);
    if(say&&!noVoice)await speak(line(a));
    const minMs=(+cfg.minShow||10)*1000-(Date.now()-t0);
    await sleep(voiceOnly?Math.max(0,minMs):Math.max((+cfg.holdAfter||3)*1000,minMs));
    $("stage").innerHTML="";busy=false;setTimeout(pump,400)};
  const layout=()=>{const k=+cfg.ovScale||1.75,o=$("ovr"),m=((cfg.ovMargin!=null)?+cfg.ovMargin:24)+"px";
    document.documentElement.style.setProperty("--k",k);o.style.width=(380*k)+"px";
    o.style.top=((cfg.ovTop!=null)?+cfg.ovTop:165)+"px";o.style.bottom=((cfg.ovBottom!=null)?+cfg.ovBottom:24)+"px";
    if(cfg.ovSide==="left"){o.style.left=m;o.style.right="auto"}else{o.style.right=m;o.style.left="auto"}};
  onValue(ref(db,"pub/cfg"),s=>{cfg=s.val()||{};layout();bar()});
  const base=()=>+cfg.goalBase||0;
  const snap=await get(ref(db,"alerts/"+K));
  snap.forEach(c=>{const a=c.val();if(a.ts>=base())total+=a.cents});bar();
  onChildAdded(query(ref(db,"alerts/"+K),orderByChild("ts"),startAt(Date.now())),s=>{const a=s.val();if(a.ts>=base())total+=a.cents;bar();queue.push(a);pump()});
}else{ // ---------- Tip page ----------
  $("app").innerHTML=`<div class="card"><h1 id="t">Tip karo</h1><div class="mut">UPI se seedha creator ko</div>
  <label>Aapka naam</label><input id="n" maxlength="30" placeholder="Rahul">
  <label>Amount (₹)</label><input id="a" type="number" min="1" max="50000" value="100">
  <div class="chips">${[50,100,200,500,1000].map(x=>`<button type="button" data-v="${x}">₹${x}</button>`).join("")}</div>
  <label>Message (stream pe dikhega)</label><textarea id="m" rows="2" maxlength="120" placeholder="Bhai mast stream!"></textarea>
  <div style="margin-top:14px"><button id="go">Pay karo</button></div><p class="mut">Pay karo dabate hi aapka UPI app khul jaayega. Na khule to neeche options aayenge, ya <b>"Kaise tip karein?"</b> video dekho.</p><div id="out"></div></div><div id="tut" style="margin-top:12px"></div>`;
  document.querySelectorAll(".chips button").forEach(b=>b.onclick=()=>$("a").value=b.dataset.v);
  const tut=()=>{const v=String(cfg.tutorial||"").trim(),box=$("tut");if(!v){box.innerHTML="";return}
    box.innerHTML=`<div class="card"><button type="button" id="tb" style="width:100%">▶ Kaise tip karein? (video dekho)</button><div id="tv" style="margin-top:12px"></div></div>`;
    $("tb").onclick=()=>{const m=v.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/)||v.match(/^([\w-]{11})$/);
      if(/\.mp4$/i.test(v))$("tv").innerHTML=`<video src="${esc(v)}" controls playsinline autoplay style="width:100%;border-radius:12px"></video>`;
      else if(m)$("tv").innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${m[1]}?autoplay=1&rel=0" style="width:100%;aspect-ratio:16/9;border:0;border-radius:12px" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
      $("tb").style.display="none"}};
  onValue(ref(db,"pub/cfg"),s=>{cfg=s.val()||{};$("t").textContent=(cfg.name||"Creator")+" ko tip karo";document.title=cfg.name||"Tip";tut()});
  $("go").onclick=async()=>{
    const o=$("out");if(!cfg.upi){o.innerHTML='<p class="mut">Setup abhi poora nahi hua.</p>';return}
    const mn=Math.max(1,+cfg.minRs||10),rs=Math.floor(+$("a").value);if(!(rs>=mn&&rs<=50000)){o.innerHTML=`<p class="mut">Amount ₹${mn} se ₹50000 ke beech rakho.</p>`;return}
    $("go").disabled=true;
    try{
      const s=await get(query(ref(db,"pending"),orderByChild("ts"),startAt(Date.now()-36e5)));const used=new Set();s.forEach(c=>{used.add(c.val().cents)});
      let cents,i=0;do{cents=rs*100+1+Math.floor(Math.random()*99);i++}while(used.has(cents)&&i<200);
      const id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
      await set(ref(db,"pending/"+id),{name:($("n").value.trim()||"Anonymous").slice(0,30),msg:$("m").value.trim().slice(0,120),cents,ts:Date.now()});
      const url=`upi://pay?pa=${encodeURIComponent(cfg.upi)}&pn=${encodeURIComponent(cfg.name||"Creator")}&am=${(cents/100).toFixed(2)}&cu=INR&tn=Tip`;
      const am=(cents/100).toFixed(2);
      const vl=cfg.tutorial?' Ya <a href="#tut" id="vl" style="color:inherit"><b>Kaise tip karein? video dekho</b></a>.':'';
      o.innerHTML=`<p><b>Exact ${inr(cents)} pay karo</b><br><span class="mut">Paise isliye jude hain ki aapka message aapke payment se match ho sake.</span></p>
<a class="btn" href="${url}" style="display:block;text-align:center;font-size:18px">UPI app kholo aur pay karo</a>
<div style="margin-top:16px;padding-top:12px;border-top:1px solid var(--bd)">
<p class="mut"><b>Button kaam na kare to:</b> UPI ID copy karo, apne UPI app mein <b>UPI ID pe pay karo</b> chuno aur exact amount <b>${am}</b> likho. Ya neeche ka QR scan karo.${vl}</p>
<div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" id="cu">UPI ID copy karo</button><button type="button" id="ca">Amount copy karo</button></div>
<div id="qr"></div><p class="mut">Payment ke 5-10 second baad stream pe alert aayega.</p></div>`;
      const cp=(t,bt)=>{try{navigator.clipboard.writeText(t);bt.textContent="Copy ho gaya ✓"}catch(e){prompt("Copy karo:",t)}};
      $("cu").onclick=e=>cp(cfg.upi,e.target);$("ca").onclick=e=>cp(am,e.target);
      const vlk=$("vl");if(vlk)vlk.onclick=e=>{e.preventDefault();const tb=$("tb");if(tb)tb.click();$("tut").scrollIntoView({behavior:"smooth"})};
      new QRCode($("qr"),{text:url,width:190,height:190});
      if(/Android|iPhone|iPad/i.test(navigator.userAgent))location.href=url;
    }catch(e){o.innerHTML='<p class="mut">Kuch gadbad hui, dobara try karo.</p>'}
    $("go").disabled=false};
}
</script></body></html>
